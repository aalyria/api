syntax = "proto3";

package aalyria.spacetime.api.model.v1;

import "google/api/field_behavior.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "nmts/v1/proto/nmts.proto";

option java_package = "com.aalyria.spacetime.api.model.v1";
option go_package = "aalyria.com/spacetime/api/model/v1";

service Model {
  // Create an nmts.Entity.
  //
  // Returns a gRPC error whenver:
  //   - the supplied nmts.Entity's Id is already used
  //   - the supplied nmts.Entity's Id is missing or ill-formed
  rpc CreateEntity(CreateEntityRequest) returns (nmts.v1.Entity) {}

  // Change a portion of an nmts.Entity.
  rpc UpdateEntity(UpdateEntityRequest) returns (nmts.v1.Entity) {}

  // Delete an nmts.Entity.
  //
  // Also deletes any nmts.Relationships in which the nmts.Entity
  // participates; if so, these are listed in the DeleteEntityResponse.
  //
  // Returns a gRPC NotFound error if an Entity with the supplied Id
  // is not in the model.
  rpc DeleteEntity(DeleteEntityRequest) returns (DeleteEntityResponse) {}

  // Insert an nmts.Relationship.
  //
  // Returns a gRPC error if any of the preconditions for a valid
  // Relationship are not met (see NMTS's //lib/validation).
  //
  // Note: If the requested relationship kind between the same two entities
  // already exists, then this has no real effect.  No duplicate is created.
  rpc CreateRelationship(CreateRelationshipRequest)
      returns (nmts.v1.Relationship) {}

  // Delete an nmts.Relationship.
  //
  // Returns a gRPC NotFound error if the Relationship is not in the model.
  rpc DeleteRelationship(DeleteRelationshipRequest)
      returns (google.protobuf.Empty) {}

  // Deletes nmts.v1.Entity objects matching the provided CEL filter.
  // Information about a specific PurgeEntities operation will be retained for
  // 30 days in complience with AIP-151 for long running operations.
  rpc PurgeEntities(PurgeEntitiesRequest)
      returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = {
      response_type: "PurgeEntitiesResponse"
      metadata_type: "PurgeMetadata"
    };
  }

  // Deletes nmts.v1.Relationship objects matching the provided CEL filter.
  // Information about a specific PurgeEntities operation will be retained for
  // 30 days in complience with AIP-151 for long running operations.
  rpc PurgeRelationships(PurgeRelationshipsRequest)
      returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = {
      response_type: "PurgeRelationshipsResponse"
      metadata_type: "PurgeMetadata"
    };
  }

  // Upsert (create-or-replace) every nmts.Entity and nmts.Relationship in a
  // Fragment in a single atomic transaction that is validated exactly once.
  //
  // Existing entities are fully replaced (an entity's kind may not change).
  // A relationship that already exists (same a/kind/z) is a no-op. The whole
  // fragment is applied atomically: on any validation or write error, nothing
  // is committed.
  rpc UpsertFragment(UpsertFragmentRequest) returns (UpsertFragmentResponse) {}

  // Retrieve an nmts.Entity
  //
  // Returns a gRPC NotFound error if an Entity with the supplied Id
  // is not in the model.
  rpc GetEntity(GetEntityRequest) returns (nmts.v1.Entity) {}

  // List the entities in the model, one page at a time.
  rpc ListEntities(ListEntitiesRequest) returns (ListEntitiesResponse) {}

  // List the relationships in the model, one page at a time.
  rpc ListRelationships(ListRelationshipsRequest)
    returns (ListRelationshipsResponse) {}
}

message CreateEntityRequest {
  nmts.v1.Entity entity = 1;
}

message UpdateEntityRequest {
  nmts.v1.Entity entity = 1;

  // If provided, update only fields included in the update_mask.
  google.protobuf.FieldMask update_mask = 2;

  // If set to true, and the entity named above is not found, a new
  // instance will be created. In this situation, `update_mask` is
  // ignored.
  bool allow_missing = 3;
}

message DeleteEntityRequest {
  string entity_id = 1;
}
message DeleteEntityResponse {
  repeated nmts.v1.Relationship deleted_relationships = 1;
}

message PurgeEntitiesRequest {
  // Required. The CEL filter will specify which nmts.v1.Entitys to purge. The
  // expression is evaluated against every nmts.v1.Entity, and each matching
  // entity is deleted.
  //
  // To purge all nmts.v1.Entity objects within the model users should use "*"
  // as the filter value. All other input for filter will be rejected with 
  // INVALID_ARGUMENT.
  //
  // Note, this only deletes nmts.v1.Entitys, it does not delete any
  // relationship that references an entity.
  string filter = 1 [(google.api.field_behavior) = REQUIRED];

  // Execute the purge request. If set to false, a dry run is performed and the
  // count of entities that would be deleted is returned.
  bool force = 2;
}

message PurgeEntitiesResponse {
  // Number of relationships deleted when `PurgeEntitiesRequest.force` is
  // true, or the number that would be deleted (dry run) when it is false.
  int64 purge_count = 1;
}

message PurgeRelationshipsRequest {
  // Required. The CEL filter will specify which nmts.v1.Relationship to purge.
  // The expression is evaluated against every nmts.v1.Relationship, and each
  // matching relationship is deleted.
  //
  // To purge all nmts.v1.Relationship objects within the model users should use
  // "*" as the filter value. All other input for filter will be rejected with 
  // INVALID_ARGUMENT.
  string filter = 1 [(google.api.field_behavior) = REQUIRED];

  // Execute the purge request. If set to false, a dry run is performed and the
  // count of relationships that would be deleted is returned.
  bool force = 2;
}

message PurgeRelationshipsResponse {
  // Number of relationships deleted when `PurgeRelationshipsRequest.force` is
  // true, or the number that would be deleted (dry run) when it is false.
  int64 purge_count = 1;
}

// PurgeMetadata describes the state of a purge operation.
message PurgeMetadata {
  // Time when the purge operation was created.
  google.protobuf.Timestamp create_time = 1;

  // Time when the purge operation is finished. Unset if it is still running.
  google.protobuf.Timestamp end_time = 2;

  // Number of items currently purged from this operation.
  int64 purge_count = 3;
}

message CreateRelationshipRequest {
  nmts.v1.Relationship relationship = 1;
}

message DeleteRelationshipRequest {
  nmts.v1.Relationship relationship = 1;
}

message GetEntityRequest {
  string entity_id = 1;
}

message ListEntitiesRequest {
  // The maximum number of entities to return. The server may return fewer.
  //
  // A page size greater than the max allowed by the server is reduced to the
  // server's max allowed number of items per page. A negative page size is
  // rejected with INVALID_ARGUMENT rather than read as unset.
  int32 page_size = 1;

  // Opaque, url-safe token naming where the next page begins. Empty on the
  // first request; thereafter the next_page_token of the previous response.
  string page_token = 2;
}

message ListEntitiesResponse {
  repeated nmts.v1.Entity entities = 1;

  // Pass this as the next request's page_token to fetch the following page. If
  // empty there are no more pages matching the query.
  string next_page_token = 2;
}

message ListRelationshipsRequest {
  // Filter the relationships using Common Expression Language (CEL).
  string filter = 1;

  // The maximum number of relationships to return per page in the query. The
  // server may return fewer records.
  //
  // A page size greater than the max allowed by the server is reduced to the
  // server's max allowed number of items per page. A negative page size is
  // rejected with INVALID_ARGUMENT rather than read as unset.
  int32 page_size = 2;

  // Opaque, url-safe token naming where the next page begins. Empty on the
  // first request; thereafter the next_page_token of the previous response.
  string page_token = 3;
}

message ListRelationshipsResponse {
  repeated nmts.v1.Relationship relationships = 1;

  // Pass this as the next request's page_token to fetch the following page. If
  // empty there are no more pages matching the query.
  string next_page_token = 2;
}

message UpsertFragmentRequest {
  nmts.v1.Fragment fragment = 1;
}

message UpsertFragmentResponse {
  int32 entities_created = 1;
  int32 entities_updated = 2;
  int32 relationships_created = 3;
}
